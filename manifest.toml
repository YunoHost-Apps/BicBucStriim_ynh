#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "bicbucstriim"
name = "BicBucStriim"
description.en = "Digital books streamer, providing web-based access to your e-book collection"
description.fr = "Interface Web pour accéder à votre collection d'e-book"

version = "4.0.1~ynh1"

maintainers = ["Alex"]

[upstream]
license = "MIT"
code = "https://github.com/mikespub-org/rvolz-BicBucStriim"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "130M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/bbs"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/mikespub-org/rvolz-BicBucStriim/releases/download/v4.0.1/bicbucstriim-4.0.1-php84.zip"
    sha256 = "ac5d6524d1cf084c1e0ee8719353d9b8f0cee51e3e9f2355346be437cbd5717d"
    in_subdir = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "bicbucstriim-.*.zip"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "php8.4-gd",
        "php8.4-intl",
        "php8.4-xml",
        "php8.4-sqlite3",
        "php8.4-mbstring",
        "php8.4-apcu",
    ]
